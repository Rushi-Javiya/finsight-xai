services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: finsight
      POSTGRES_USER: finsight
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finsight}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finsight -d finsight"]
      interval: 5s
      timeout: 3s
      retries: 10

  ml-service:
    build: ./ml-service
    environment:
      ML_MARKET_DATA_PROVIDER: ${ML_MARKET_DATA_PROVIDER:-yahoo}
      ML_API_KEY: ${ML_API_KEY:-change-me}
    expose:
      - "8000"

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_started
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/finsight
      DB_USERNAME: finsight
      DB_PASSWORD: ${POSTGRES_PASSWORD:-finsight}
      ML_SERVICE_URL: http://ml-service:8000
      ML_API_KEY: ${ML_API_KEY:-change-me}
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
